name: BCH chain tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bch:
    name: x402-chain-bch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check BCH crate
        run: cargo check --locked -p x402-chain-bch

      - name: Test BCH crate
        run: cargo test --locked -p x402-chain-bch --lib

      - name: Install Clang for the wasm32 libsecp256k1 build
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build BCH crate for wasm32
        run: cargo build --locked -p x402-chain-bch --target wasm32-unknown-unknown
